name: AI review

# Copy to .github/workflows/ in the project. pull_request_target runs this file from the default
# branch, so a PR cannot change its own review. Pin AutoFlow to a release commit SHA (tags can be moved).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: autoflow-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  autoflow:
    uses: ouraihub/AutoFlow/.github/workflows/review.yml@ef80af630a59518d33187e59f74652b7b1a5bf69 # v0.2.0
    with:
      model: ${{ vars.AI_MODEL }}
    secrets:
      AI_KEYS: ${{ secrets.AI_KEYS }}
      AUTOFLOW_TOKEN: ${{ secrets.AUTOFLOW_TOKEN }}
