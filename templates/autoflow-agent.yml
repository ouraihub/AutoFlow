name: AutoFlow agent

# Copy to .github/workflows/ in the project. Every task is designed first (docs/issue-N.md), then built
# after you reply 确认. Reply 继续 to resume an interrupted run. Pin AutoFlow to a release commit SHA (tags can be moved).
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  autoflow:
    uses: ouraihub/AutoFlow/.github/workflows/agent.yml@ef80af630a59518d33187e59f74652b7b1a5bf69 # v0.2.0
    with:
      model: ${{ vars.AI_MODEL }}
      setup: '' # e.g. pnpm install --frozen-lockfile
      checks: '' # e.g. pnpm test
    secrets:
      AI_KEYS: ${{ secrets.AI_KEYS }}
      AUTOFLOW_TOKEN: ${{ secrets.AUTOFLOW_TOKEN }}
